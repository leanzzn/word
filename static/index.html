<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 단어장</title>
<style>
  /* 파스텔 대시보드 느낌: 초록 배경 위에 크림색 패널, 둥근 카드, 알약 버튼 */
  :root{
    --page:#C1E8D5; --panel:#F8F5F2; --card:#fff; --line:#EAE4DE;
    --txt:#171719; --sub:#6E6A66; --main:#111113; --ok:#12a150; --no:#e5484d;
    --pink:#FFD9DB; --yellow:#FDE2B5; --purple:#D3D5FE; --green:#B9EEDB;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--txt);font-size:17px;
       font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
       -webkit-font-smoothing:antialiased}
  .shell{max-width:760px;margin:0 auto;padding:18px 14px 40px}

  /* 상단 내비게이션 */
  .nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;
       overflow-x:auto;white-space:nowrap;padding-bottom:2px}
  .logo{width:40px;height:40px;border-radius:13px;background:var(--main);flex:none;
        display:flex;align-items:center;justify-content:center;font-size:18px}
  .tab{background:#fff;color:var(--sub);padding:10px 18px;border-radius:999px;
       font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .tab.on{background:var(--main);color:#fff}

  .panel{background:var(--panel);border-radius:28px;padding:26px 20px 30px;
         box-shadow:0 18px 40px rgba(23,23,25,.10)}
  h1{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;
        padding:18px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}

  button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:13px 22px;
         background:var(--main);color:#fff;cursor:pointer;
         transition:transform .12s,box-shadow .12s,background .12s}
  button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(23,23,25,.18)}
  button:disabled{background:#D8D3CE;cursor:not-allowed}
  button.ghost{background:#fff;color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  button.ghost:disabled{background:#EDE8E3;color:#B3ADA7;box-shadow:none}
  button.link{background:none;color:var(--sub);padding:6px 2px;font-size:14px;font-weight:500}
  button.link:hover:not(:disabled){transform:none;box-shadow:none;color:var(--txt)}

  input[type=text]{font:inherit;width:100%;padding:15px 18px;border-radius:16px;
                   border:1px solid var(--line);background:#fff;outline:0}
  input[type=text]:focus{border-color:var(--main)}
  input[type=file]{font-size:14px;color:var(--sub);min-width:0}
  input[type=file]::file-selector-button{font:inherit;font-size:14px;font-weight:600;border:0;
    cursor:pointer;background:#EFEAE5;color:var(--txt);padding:9px 14px;border-radius:999px;
    margin-right:10px}

  .clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
  .clickable:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(23,23,25,.10)}
  .muted{color:var(--sub);font-size:14px}

  /* 단어장·유닛 목록: 넓은 화면은 두 칸, 카드 색은 파스텔 4색을 돌려가며 */
  #books,#units{display:grid;gap:12px}
  @media(min-width:620px){#books,#units{grid-template-columns:1fr 1fr}}
  #books .card,#units .card{margin:0;border-color:transparent;min-height:116px}
  #books .card{align-items:flex-end}
  #units .card{display:flex;flex-direction:column;justify-content:flex-end}
  #books .card:nth-child(4n+1),#units .card:nth-child(4n+1){background:var(--pink)}
  #books .card:nth-child(4n+2),#units .card:nth-child(4n+2){background:var(--yellow)}
  #books .card:nth-child(4n+3),#units .card:nth-child(4n+3){background:var(--purple)}
  #books .card:nth-child(4n),  #units .card:nth-child(4n)  {background:var(--green)}
  #books b,#units b{display:block;font-size:19px;line-height:1.25;margin-bottom:6px}
  #books .muted,#units .muted,#books button.link,#units button.link{color:#57534E}

  /* 퀴즈 */
  .bar{height:8px;background:#E7E1DB;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .25s}
  .q{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:10px}
  .prompt{background:var(--purple);border-radius:24px;padding:34px 20px;margin:0 0 20px;
          font-size:30px;font-weight:700;text-align:center;word-break:break-word}
  .opt{display:block;width:100%;text-align:left;background:#fff;color:var(--txt);
       border:1px solid var(--line);border-radius:18px;padding:15px 20px;margin-bottom:9px;
       font-weight:500}
  .opt:hover:not(:disabled){transform:none;border-color:var(--main);
                            box-shadow:0 4px 12px rgba(23,23,25,.08)}
  .opt:disabled{background:#fff;color:#B3ADA7}
  .opt.right,.opt.right:disabled{border-color:var(--ok);background:#E7F6EE;color:var(--ok);font-weight:700}
  .opt.wrong,.opt.wrong:disabled{border-color:var(--no);background:#FDEEEE;color:var(--no)}
  .fb{min-height:26px;margin:16px 0;text-align:center;font-weight:700}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

  .hide{display:none}
  .center{text-align:center}
  .big{font-size:56px;margin:10px 0 8px}
</style>
</head>
<body>
<div class="shell">

<nav class="nav">
  <span class="logo">📚</span>
  <button class="tab" id="tab-lib" onclick="showLibrary()">🏠 보관함</button>
  <button class="tab" id="tab-wrong" onclick="showWrong()">📕 오답노트 <span id="wrongCount"></span></button>
</nav>

<div class="panel">

<!-- ── 보관함 ───────────────────────────────────────────── -->
<section id="v-library">
  <h1>내 단어장</h1>
  <p class="sub">PDF를 올리면 글자를 그대로 읽어서 저장해둡니다. (AI 안 씀)</p>
  <div class="card">
    <div class="row">
      <input type="file" id="pdf" accept="application/pdf" class="grow">
      <button id="up">올리기</button>
    </div>
    <p class="muted" id="upmsg" style="margin:10px 0 0"></p>
  </div>
  <div id="books" style="margin-top:12px"></div>
  <p class="center" style="margin-top:24px">
    <button class="link" id="resetKey">AI 키 다시 입력하기</button>
  </p>
</section>

<!-- ── 오답노트 ─────────────────────────────────────────── -->
<section id="v-wrong" class="hide">
  <h1>오답노트</h1>
  <p class="sub">퀴즈에서 틀린 단어만 모아둡니다. 외운 건 지우세요.</p>
  <div id="wrongList"></div>
  <button class="ghost hide" id="clearWrong" style="width:100%; margin-top:10px">전체 비우기</button>
</section>

<!-- ── 유닛 선택 ────────────────────────────────────────── -->
<section id="v-units" class="hide">
  <h1 id="bookName"></h1>
  <p class="sub">유닛을 고르면 20문제가 시작됩니다.</p>
  <div id="units"></div>
</section>

<!-- ── 퀴즈 ─────────────────────────────────────────────── -->
<section id="v-quiz" class="hide">
  <button class="link" onclick="showUnits()">← 유닛 선택</button>
  <div class="bar" style="margin-top:10px"><i id="bar" style="width:0%"></i></div>
  <div class="q" id="qinfo"></div>
  <div class="prompt" id="prompt"></div>

  <div id="mc"></div>

  <div id="sa" class="hide">
    <input type="text" id="answer" placeholder="한글 뜻을 입력하세요" autocomplete="off">
    <button id="submit" style="width:100%; margin-top:8px">확인</button>
  </div>

  <div class="fb" id="fb"></div>
  <button id="next" style="width:100%" disabled>다음 문제</button>
  <button class="ghost" id="giveup" style="width:100%; margin-top:8px">포기하기 (오답노트에 담기)</button>
</section>

<!-- ── 완료 ─────────────────────────────────────────────── -->
<section id="v-done" class="hide center">
  <div class="big">🎉</div>
  <h1 id="doneTitle"></h1>
  <p class="sub" id="doneSub"></p>
  <button id="nextUnit" style="width:100%; margin-bottom:8px">다음 유닛으로 넘어가기</button>
  <button class="ghost" style="width:100%" onclick="showUnits()">유닛 목록</button>
</section>

</div>
</div>
<script>
const $ = s => document.querySelector(s);
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

let L;                                    // static/lib.mjs (순수 계산 함수들)
const lib = async () => (L ||= await import('./lib.mjs'));

/* ── 서버 (저장만 담당) ───────────────────────────────── */
async function api(u, o = {}) {
  const r = await fetch(u, {
    ...o, headers: { ...(o.headers || {}), 'x-app-key': localStorage.appkey || '' },
  });
  if (r.status === 401) {                 // 배포판은 비밀번호로 잠겨 있다
    const p = prompt('비밀번호를 입력하세요');
    if (!p) throw '비밀번호가 필요합니다';
    localStorage.appkey = p.trim();
    return api(u, o);
  }
  const j = await r.json();
  if (!r.ok) throw (j.detail || '오류');
  return j;
}
const postJSON = (u, body) => api(u, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
});

/* ── AI (브라우저가 직접 호출. 키는 이 브라우저에만 저장된다) ── */
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';

function aiKey() {
  let k = localStorage.gkey;
  if (!k) {
    k = prompt('Google AI Studio API 키를 붙여넣어 주세요.\n' +
               'aistudio.google.com 에서 무료로 발급받을 수 있습니다.');
    if (!k) throw 'AI 키가 필요합니다';
    localStorage.gkey = k = k.trim();
  }
  return k;
}

async function ai(parts, schema, extra = {}, timeoutMs = 20000) {
  const r = await fetch(GEMINI, {
    method: 'POST',
    signal: AbortSignal.timeout(timeoutMs),   // 응답이 없으면 멈춰 있지 말고 포기한다
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': aiKey() },
    body: JSON.stringify({
      contents: [{ parts }],
      generationConfig: {
        responseMimeType: 'application/json', responseSchema: schema,
        thinkingConfig: { thinkingBudget: 0 }, ...extra,
      },
    }),
  });
  if (!r.ok) {
    const t = await r.text();
    if (t.includes('API_KEY_INVALID') || r.status === 403) delete localStorage.gkey;
    throw `AI 오류 ${r.status}: ${t.slice(0, 160)}`;
  }
  const j = await r.json();
  const t = (j.candidates?.[0]?.content?.parts ?? []).map(p => p.text).filter(Boolean).join('');
  if (!t) throw 'AI가 빈 응답을 보냈습니다';
  return JSON.parse(t);
}

/* ── PDF에서 글자 뽑기 (브라우저가 처리) ──────────────── */
let _pdfjs;
async function pdfText(file) {
  const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.2.108';
  if (!_pdfjs) {
    _pdfjs = await import(`${CDN}/pdf.min.mjs`);
    _pdfjs.GlobalWorkerOptions.workerSrc = `${CDN}/pdf.worker.min.mjs`;
  }
  const doc = await _pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = '';
  for (let i = 1; i <= doc.numPages; i++) {
    const c = await (await doc.getPage(i)).getTextContent();
    out += c.items.map(t => t.str + (t.hasEOL ? '\n' : '')).join('') + '\n';
  }
  return out;
}


/* ── 화면 전환 ────────────────────────────────────────── */
let book = null, unitNames = [], unitIdx = 0, qs = [], qi = 0, locked = false, gaveUp = 0;

const WRONG_MSG = '틀렸어 븅딱아ㅋㅋ.  이 문제 나중에 또 나온다';

function view(id) {
  ['library', 'wrong', 'units', 'quiz', 'done'].forEach(v =>
    $('#v-' + v).classList.toggle('hide', v !== id));
  $('#tab-wrong').classList.toggle('on', id === 'wrong');
  $('#tab-lib').classList.toggle('on', id !== 'wrong');
  window.scrollTo(0, 0);
}

/* ── 보관함 ── */
// 서버 목록에 반영되기까지 몇 초 걸리므로, 방금 올린/지운 건 화면에서 직접 맞춰준다.
let justAdded = null;
const justDeleted = new Set();

async function showLibrary() {
  view('library');
  api('/api/wrong').then(w => $('#wrongCount').textContent = w.length ? `(${w.length})` : '')
    .catch(() => {});
  let books = (await api('/api/books')).filter(b => !justDeleted.has(b.id));
  if (justAdded && !books.some(b => b.id === justAdded.id)) books = [justAdded, ...books];
  $('#books').innerHTML = books.length ? '' : '<p class="muted">아직 올린 단어장이 없습니다.</p>';
  books.forEach(b => {
    const el = document.createElement('div');
    el.className = 'card row';
    el.innerHTML = `<div class="grow clickable"><b></b>
      <div class="muted">${b.units}개 유닛 · ${b.words}개 단어</div></div>
      <button class="link">삭제</button>`;
    el.querySelector('b').textContent = b.name;
    el.firstElementChild.onclick = () => openBook(b.id);
    el.querySelector('button').onclick = async () => {
      if (!confirm(`"${b.name}" 를 삭제할까요?`)) return;
      await api('/api/books/' + b.id, { method: 'DELETE' });
      justDeleted.add(b.id);
      if (justAdded?.id === b.id) justAdded = null;
      showLibrary();
    };
    $('#books').append(el);
  });
}

$('#resetKey').onclick = () => {
  delete localStorage.gkey;
  try { aiKey(); alert('AI 키를 저장했습니다.'); } catch (e) { alert(e); }
};

/* ── 단어장 올리기: 브라우저가 PDF 글자를 뽑아 그대로 정리한 뒤 서버에 저장 (AI 안 씀) ── */
$('#up').onclick = async () => {
  const f = $('#pdf').files[0];
  if (!f) return alert('PDF 파일을 선택해주세요.');
  const msg = t => $('#upmsg').textContent = t;
  $('#up').disabled = true;
  try {
    const { cut, parseLocal, group } = await lib();
    msg('PDF에서 글자를 읽는 중...');
    const text = await pdfText(f);
    if (text.trim().length < 30) throw '글자가 없는 스캔본 PDF입니다. 글자가 들어있는 PDF로 올려주세요';
    const entries = parseLocal(cut(text));

    const units = group(entries);
    if (!Object.keys(units).length) throw '단어를 찾지 못했습니다. 한 줄에 영단어와 한글 뜻이 나란히 있는 PDF여야 합니다';
    msg('저장하는 중...');
    const b = await postJSON('/api/books', { name: f.name, units });
    const n = Object.values(b.units).reduce((s, w) => s + w.length, 0);
    justAdded = { id: b.id, name: b.name, units: Object.keys(b.units).length, words: n };
    msg(`완료! ${justAdded.units}개 유닛, ${n}개 단어`);
    $('#pdf').value = '';
    book = b;                              // 바로 유닛 목록으로 넘어간다
    unitNames = Object.keys(b.units);
    showUnits();
  } catch (e) { msg('실패: ' + e); }
  $('#up').disabled = false;
};

/* ── 오답노트 ── */
async function showWrong() {
  view('wrong');
  const list = await api('/api/wrong');
  $('#wrongCount').textContent = list.length ? `(${list.length})` : '';
  $('#clearWrong').classList.toggle('hide', !list.length);
  $('#wrongList').innerHTML = list.length ? ''
    : '<p class="muted">아직 틀린 단어가 없습니다.</p>';
  list.forEach(w => {
    const el = document.createElement('div');
    el.className = 'card row';
    el.innerHTML = `<div class="grow"><b></b><div class="muted"></div></div>
      <button class="link">외웠어요</button>`;
    el.querySelector('b').textContent = w.en;
    el.querySelector('.muted').textContent = w.ko;
    el.querySelector('button').onclick = async () => {
      await api('/api/wrong/' + encodeURIComponent(w.en), { method: 'DELETE' });
      showWrong();
    };
    $('#wrongList').append(el);
  });
}
$('#clearWrong').onclick = async () => {
  if (!confirm('오답노트를 전부 비울까요?')) return;
  await api('/api/wrong/*', { method: 'DELETE' });
  showWrong();
};

/** 틀렸을 때: 오답노트에 담고, 그 문제를 같은 유형 맨 뒤에 다시 넣는다. */
function miss() {                         // L(lib)은 render()가 이미 불러놨다
  const q = qs[qi];
  logWrong(q);
  if (q.requeued) return;                 // 한 번 보여줄 때 한 번만 다시 넣는다
  q.requeued = true;
  qs = L.requeue(qs, qi);
}

function logWrong(q) {
  if (q.logged) return;                   // 한 문제당 한 번만 기록
  q.logged = true;
  postJSON('/api/wrong', { en: q.w.en, ko: q.w.ko }).catch(() => {});
}

/* ── 유닛 ── */
async function openBook(id) {
  book = await api('/api/books/' + id);
  unitNames = Object.keys(book.units);
  showUnits();
}

function showUnits() {
  view('units');
  $('#bookName').textContent = book.name;
  $('#units').innerHTML = '';
  unitNames.forEach((u, i) => {
    const el = document.createElement('div');
    el.className = 'card clickable';
    el.innerHTML = `<b></b> <div class="muted">${book.units[u].length}개 단어</div>`;
    el.querySelector('b').textContent = u;
    el.onclick = () => startUnit(i);
    $('#units').append(el);
  });
}

/* ── 퀴즈 ── */
async function startUnit(i) {
  const { buildQuestions } = await lib();
  unitIdx = i;
  qs = buildQuestions(book.units[unitNames[i]], shuffle);
  qi = 0;
  gaveUp = 0;
  view('quiz');
  preload();                              // 뒤 문제 선지는 첫 문제와 동시에 만든다
  render();
}

const unitWords = () => book.units[unitNames[unitIdx]].map(w => w.en);

/* 객관식 오답 선지.
   문제 하나당 한 벌씩 만들어 붙여둔다. 다시 낸 문제는 새 문제로 치니까 선지도 새로 만든다.
   만드는 시점은 앞 문제를 푸는 동안(preload)이라 기다릴 일이 없다. */
const optCache = new WeakMap();
function distractors(q) {
  const w = q.w;
  if (!optCache.has(q)) optCache.set(q, (async () => {
    const { fallback } = await lib();
    try {
      const got = (await ai([{
        text: `영단어 "${w.en}" (뜻: ${w.ko}) 의 객관식 오답 선지 3개를 만들어줘.\n` +
          `- 실제 존재하는 영단어일 것\n` +
          `- 철자·발음·형태가 비슷해서 헷갈릴 것 (예: adapt/adopt/adept)\n` +
          `- "${w.en}" 와 뜻이 같거나 비슷하면 안 됨\n` +
          `- 매번 다른 조합으로 다채롭게\n영단어 3개만 JSON 배열로.`,
      }], { type: 'ARRAY', items: { type: 'STRING' } }, { temperature: 1.4 }, 8000))
        .map(x => String(x).trim())
        .filter(x => x && x.toLowerCase() !== w.en.toLowerCase());
      return got.length >= 3 ? got.slice(0, 3)
        : got.concat(fallback(w.en, unitWords())).slice(0, 3);
    } catch {
      return fallback(w.en, unitWords());     // AI가 느리거나 실패하면 비슷한 단어로 대신
    }
  })());
  return optCache.get(q);
}

/** 앞으로 나올 객관식 n개의 선지를 미리 만들어 둔다. */
function preload(n = 2) {
  qs.slice(qi + 1).filter(x => x.type === 'mc').slice(0, n).forEach(distractors);
}

async function render() {
  await lib();
  const q = qs[qi], w = q.w;
  locked = false;
  $('#bar').style.width = (qi / qs.length * 100) + '%';
  $('#qinfo').textContent = `${qi + 1} / ${qs.length} · ` +
    (q.type === 'mc' ? '뜻에 맞는 영단어 고르기' : '영단어의 뜻 입력하기') +
    (q.retry ? ' · 다시 도전' : '');
  $('#prompt').textContent = q.type === 'mc' ? w.ko : w.en;
  $('#fb').textContent = ''; $('#fb').className = 'fb';
  $('#next').disabled = true;
  $('#giveup').disabled = false;
  $('#next').textContent = qi === qs.length - 1 ? '결과 보기' : '다음 문제';
  $('#mc').classList.toggle('hide', q.type !== 'mc');
  $('#sa').classList.toggle('hide', q.type !== 'sa');

  if (q.type === 'sa') {
    $('#answer').value = ''; $('#answer').disabled = false; $('#answer').focus();
    preload();
    return;
  }

  // 이전 문제의 선지가 남아 보이지 않게 먼저 비운다
  $('#mc').innerHTML = optCache.has(q) ? '' : '<div class="muted center">선지를 만드는 중...</div>';
  const wrong = await distractors(q);
  if (qs[qi] !== q) return;               // 그 사이 문제가 바뀌었으면 버림

  $('#mc').innerHTML = '';
  shuffle([w.en, ...wrong.slice(0, 3)]).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = opt;
    b.onclick = () => pickMc(b, opt === w.en);
    $('#mc').append(b);
  });
  preload();                              // 다음 문제 선지를 미리 만들어 둔다
}

function pickMc(btn, correct) {
  if (locked) return;
  if (correct) {
    locked = true;
    btn.className = 'opt right';
    $('#mc').querySelectorAll('button').forEach(b => b.disabled = true);
    say(true, `정답! ${qs[qi].w.en} = ${qs[qi].w.ko}`);   // 전체 뜻을 한 번 보여준다
  } else {
    btn.className = 'opt wrong';
    btn.disabled = true;
    miss();
    say(false, WRONG_MSG);
  }
}

$('#submit').onclick = async () => {
  if (locked) return;
  const { checkKo } = await lib();
  const w = qs[qi].w;
  if (checkKo($('#answer').value, w.ko)) {
    locked = true;
    $('#answer').disabled = true;
    say(true, `정답! ${w.en} = ${w.ko}`);      // 뜻이 여러 개면 전부 보여준다
  } else {
    miss();
    say(false, WRONG_MSG);
    $('#answer').select();
  }
};
$('#answer').onkeydown = e => { if (e.key === 'Enter') $('#submit').click(); };

function say(ok, msg) {
  $('#fb').textContent = msg;
  $('#fb').className = 'fb ' + (ok ? 'ok' : 'no');
  $('#next').disabled = false;            // 맞히든 틀리든 다음으로 넘어갈 수 있다
  $('#next').textContent = qi === qs.length - 1 ? '결과 보기' : '다음 문제';
  $('#giveup').disabled = ok;             // 맞혔으면 포기할 일이 없다
}

$('#next').onclick = () => {
  if ($('#next').disabled) return;
  if (++qi >= qs.length) return finish();
  render();
};

/* 포기하기: 정답은 안 알려주고, 그 단어만 오답노트에 담고 다음 문제로 넘어간다. */
$('#giveup').onclick = () => {
  if (locked) return;
  logWrong(qs[qi]);                       // 포기한 건 오답노트에만
  qs = L.dropRetry(qs, qi);               // 틀려서 뒤에 넣어둔 것도 빼낸다 (문제 수 유지)
  gaveUp++;
  if (++qi >= qs.length) return finish();
  render();
};

function finish() {
  view('done');
  $('#doneTitle').textContent = unitNames[unitIdx] + ' 클리어!';
  $('#doneSub').textContent = gaveUp
    ? `${qs.length}문제 중 ${gaveUp}개는 오답노트에 담았습니다.`
    : `${qs.length}문제 모두 맞혔습니다.`;
  const last = unitIdx >= unitNames.length - 1;
  $('#nextUnit').disabled = last;
  $('#nextUnit').textContent = last ? '마지막 유닛입니다' : `다음 유닛 (${unitNames[unitIdx + 1]})`;
}
$('#nextUnit').onclick = () => startUnit(unitIdx + 1);

showLibrary();
</script>
</body>
</html>
